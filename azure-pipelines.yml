trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

jobs:
  - job: LintAndTest
    displayName: 'Run ESLint and Prettier'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
      - checkout: self

      - task: NodeTool@0
        inputs:
          versionSpec: '20'

      - script: npm install
        displayName: 'Install dependencies'

      - script: npm run lint
        displayName: 'Run ESLint'

      - script: npm run format
        displayName: 'Run Prettier'
